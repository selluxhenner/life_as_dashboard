# /etc/nginx/sites-available/agentic-os.serviweb.ch (installed by nginx-setup.sh; certbot adds the 443 block)
server {
    listen 80;
    listen [::]:80;
    server_name agentic-os.serviweb.ch;

    client_max_body_size 25m;   # voice uploads

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    server_tokens off;

    location /api/ {
        proxy_pass http://127.0.0.1:3160;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # phone ConversationRelay WebSocket (/api/phone/relay/:id)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_agentic;
        proxy_read_timeout 3600s;
        proxy_buffering off;    # streaming assistant replies
    }

    location / {
        return 404;
    }
}

map $http_upgrade $connection_upgrade_agentic {
    default upgrade;
    ''      close;
}

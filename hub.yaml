id: life-os
run:
  dev: npm run dev
  test: npm test
  build: npm run build
deploy:
  target: hetzner-main
  # Run from a clean `git archive` export plus server/src/data/countries.json, not the working copy (vault: LIFE OS – Server-Deployment Hetzner).
  command: ./server/deploy/deploy-docker.sh
health: https://agentic-os.serviweb.ch/api/health
gate_level: standard
platforms: [windows, macos, android, linux]
provides:
  - { type: http-api, name: hub-state, version: 1.0.0, spec: docs/hub-api.md }
  - { type: http-api, name: ops-reports, version: 1.0.0, spec: docs/hub-api.md }
  - { type: http-api, name: approvals, version: 1.0.0, spec: docs/hub-api.md }
consumes:
  - { tool: obsidian_vault, contract: notes-fs, version: ^1.0.0 }
  - { tool: hub, contract: registry, version: ^1.0.0 }
  - { tool: agentic-os-framework, contract: governance-rules, version: ^1.0.0 }
